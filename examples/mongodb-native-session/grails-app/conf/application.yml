grails:
    profile: web
    codegen:
        defaultPackage: example
    gorm:
        reactor:
            events: false
    mongodb:
        url: mongodb://localhost:27017/mongodb_native_session_test?replicaSet=rs0
        nativeTransactionsEnabled: true

# Also add at datastore level
dataSource: {}

grails.mongodb.nativeTransactionsEnabled: true

logging:
    level:
        example: DEBUG
        org.grails.datastore.mapping.mongo: DEBUG
        org.grails.datastore.gorm.mongo: DEBUG