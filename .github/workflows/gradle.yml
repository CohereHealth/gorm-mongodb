name: Java CI
on:
  push:
    branches:
      - '[6-9]+.[0-9]+.x'
      - feat/native-mongodb-transactions
  pull_request:
    branches:
      - '[6-9]+.[0-9]+.x'
      - feat/native-mongodb-transactions
  workflow_dispatch:
    inputs:
      message:
        description: 'Snapshot information (e.g. New Core Snapshot Tue Dec 15 00:07:18 UTC 2020 f212f54)'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      WORKSPACE: ${{ github.workspace }}
      GRADLE_OPTS: -Xmx1500m -Dfile.encoding=UTF-8
    strategy:
      matrix:
        mongodb-version: ['4.4', '5.0', '6.0' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@v1.10.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-replica-set: rs0
      - name: Run Example Integration Tests
        uses: gradle/gradle-build-action@v3
        env:
          GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
        with:
          arguments: :examples-mongodb-native-session:integrationTest
      - name: Run Build
        uses: gradle/gradle-build-action@v3
        env:
          GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
        with:
          arguments: build -Dgeb.env=chromeHeadless
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build]
    permissions:
      id-token: write
      contents: read
    env:
      WORKSPACE: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '11'
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-2
    - name: Publish snapshot to CodeArtifact
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      run: |
        export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
          --domain coherehealth-main \
          --domain-owner $AWS_ACCOUNT_ID \
          --region us-east-2 \
          --query authorizationToken \
          --output text)

        # Get version from gradle.properties
        VERSION=$(grep "^projectVersion=" gradle.properties | cut -d'=' -f2)

        echo "======================================"
        echo "Publishing to CodeArtifact"
        echo "======================================"
        echo "Repository: coherehealth-main"
        echo "Domain: coherehealth-main"
        echo "Region: us-east-2"
        echo "Group: com.coherehealth.grails"
        echo "Version: $VERSION"
        echo "URL: https://coherehealth-main-${AWS_ACCOUNT_ID}.d.codeartifact.us-east-2.amazonaws.com/maven/coherehealth-main/"
        echo "======================================"
        
        ./gradlew publish \
          -PcodeartifactToken=$CODEARTIFACT_AUTH_TOKEN \
          -PawsAccountId=$AWS_ACCOUNT_ID

        echo ""
        echo "======================================"
        echo "✅ Published Successfully"
        echo "======================================"
        echo "Listing published packages..."
        aws codeartifact list-packages \
          --domain coherehealth-main \
          --domain-owner $AWS_ACCOUNT_ID \
          --repository coherehealth-main \
          --region us-east-2 \
          --format maven \
          --namespace com.coherehealth.grails \
          --query 'packages[*].{Package:package,LatestVersion:latestVersion.version}' \
          --output table
