name: Java CI
on:
  push:
    branches:
      - '[6-9]+.[0-9]+.x'
      - feat/native-mongodb-transactions
  pull_request:
  workflow_dispatch:
    inputs:
      message:
        description: 'Snapshot information (e.g. New Core Snapshot Tue Dec 15 00:07:18 UTC 2020 f212f54)'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      WORKSPACE: ${{ github.workspace }}
      GRADLE_OPTS: -Xmx1500m -Dfile.encoding=UTF-8
    strategy:
      matrix:
        mongodb-version: ['4.4', '5.0', '6.0' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'
      - name: Start MongoDB
        run: |
          docker run -d --name mongodb-ci -p 27017:27017 mongo:${{ matrix.mongodb-version }} --replSet rs0
          for i in {1..60}; do docker exec mongodb-ci mongosh --eval "db.adminCommand({ping: 1})" > /dev/null 2>&1 && break || docker exec mongodb-ci mongo --eval "db.adminCommand({ping: 1})" > /dev/null 2>&1 && break || sleep 1; done
          docker exec mongodb-ci mongosh --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})" 2>/dev/null || docker exec mongodb-ci mongo --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for i in {1..30}; do docker exec mongodb-ci mongosh --eval "rs.status().ok" 2>/dev/null | grep -q 1 && break || docker exec mongodb-ci mongo --eval "rs.status().ok" 2>/dev/null | grep -q 1 && break || sleep 1; done
      - name: Generate example integration tests commands
        id: example_tests
        run: |
          EXCLUDES=""
          INCLUDES=""
          for project in $(./gradlew -q projects | grep "Project ':examples-" | sed "s/.*':examples-/examples-/" | sed "s/'$//"); do
            # Always exclude build and check
            EXCLUDES="${EXCLUDES} -x ${project}:build -x ${project}:check"
            # Check if project has integrationTest task
            if ./gradlew -q "$project":tasks --all 2>&1 | grep -q "^integrationTest$"; then
              EXCLUDES="${EXCLUDES} -x ${project}:integrationTest"
              INCLUDES="${INCLUDES} ${project}:integrationTest"
            fi
          done
          echo "EXCLUDE_CMD=$EXCLUDES" >> $GITHUB_OUTPUT
          echo "INCLUDE_CMD=$INCLUDES" >> $GITHUB_OUTPUT
      - name: Run Build and Unit Tests
        uses: gradle/gradle-build-action@v3
        env:
          GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
        with:
          arguments: build -Dgeb.env=chromeHeadless ${{ steps.example_tests.outputs.EXCLUDE_CMD }}
      - name: Run Example Integration Tests
        uses: gradle/gradle-build-action@v3
        env:
          GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
        with:
          arguments: -Dgeb.env=firefoxHeadless ${{ steps.example_tests.outputs.INCLUDE_CMD }}
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build]
    permissions:
      id-token: write
      contents: read
    env:
      WORKSPACE: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '11'
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-2
    - name: Publish snapshot to CodeArtifact
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      run: |
        export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
          --domain coherehealth-main \
          --domain-owner $AWS_ACCOUNT_ID \
          --region us-east-2 \
          --query authorizationToken \
          --output text)

        # Get version from gradle.properties
        VERSION=$(grep "^projectVersion=" gradle.properties | cut -d'=' -f2)

        echo "======================================"
        echo "Publishing to CodeArtifact"
        echo "======================================"
        echo "Repository: coherehealth-main"
        echo "Domain: coherehealth-main"
        echo "Region: us-east-2"
        echo "Group: com.coherehealth.grails"
        echo "Version: $VERSION"
        echo "URL: https://coherehealth-main-${AWS_ACCOUNT_ID}.d.codeartifact.us-east-2.amazonaws.com/maven/coherehealth-main/"
        echo "======================================"
        
        ./gradlew publish \
          -PcodeartifactToken=$CODEARTIFACT_AUTH_TOKEN \
          -PawsAccountId=$AWS_ACCOUNT_ID

        echo ""
        echo "======================================"
        echo "✅ Published Successfully"
        echo "======================================"
        echo "Listing published packages..."
        aws codeartifact list-packages \
          --domain coherehealth-main \
          --domain-owner $AWS_ACCOUNT_ID \
          --repository coherehealth-main \
          --region us-east-2 \
          --format maven \
          --namespace com.coherehealth.grails \
          --query 'packages[*].{Package:package,LatestVersion:latestVersion.version}' \
          --output table
