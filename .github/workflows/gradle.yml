name: Java CI
on:
  push:
    branches:
      - '[6-9]+.[0-9]+.x'
      - feat/native-mongodb-transactions
  pull_request:
    branches:
      - '[6-9]+.[0-9]+.x'
      - feat/native-mongodb-transactions
  workflow_dispatch:
    inputs:
      message:
        description: 'Snapshot information (e.g. New Core Snapshot Tue Dec 15 00:07:18 UTC 2020 f212f54)'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      WORKSPACE: ${{ github.workspace }}
      GRADLE_OPTS: -Xmx1500m -Dfile.encoding=UTF-8
    strategy:
      matrix:
        mongodb-version: ['4.4', '5.0', '6.0' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'
      - name: Start MongoDB
        run: |
          docker run -d --name mongodb-ci -p 27017:27017 mongo:${{ matrix.mongodb-version }} --replSet rs0
          for i in {1..60}; do docker exec mongodb-ci mongosh --eval "db.adminCommand({ping: 1})" > /dev/null 2>&1 && break || docker exec mongodb-ci mongo --eval "db.adminCommand({ping: 1})" > /dev/null 2>&1 && break || sleep 1; done
          docker exec mongodb-ci mongosh --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})" 2>/dev/null || docker exec mongodb-ci mongo --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for i in {1..30}; do docker exec mongodb-ci mongosh --eval "rs.status().ok" 2>/dev/null | grep -q 1 && break || docker exec mongodb-ci mongo --eval "rs.status().ok" 2>/dev/null | grep -q 1 && break || sleep 1; done
      - name: Generate example integration tests commands
        id: example_tests
        run: |
          EXCLUDES=""
          INCLUDES=""
          for project in $(./gradlew -q projects | grep "Project ':examples-" | sed "s/.*':examples-/examples-/" | sed "s/'$//"); do
            # Always exclude build and check
            EXCLUDES="${EXCLUDES} -x ${project}:build -x ${project}:check"
            # Check if project has integrationTest task
            if ./gradlew -q "$project":tasks --all 2>&1 | grep -q "^integrationTest$"; then
              EXCLUDES="${EXCLUDES} -x ${project}:integrationTest"
              INCLUDES="${INCLUDES} ${project}:integrationTest"
            fi
          done
          echo "EXCLUDE_CMD=$EXCLUDES" >> $GITHUB_OUTPUT
          echo "INCLUDE_CMD=$INCLUDES" >> $GITHUB_OUTPUT
      - name: Run Build and Unit Tests
        uses: gradle/gradle-build-action@v3
        env:
          GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
        with:
          arguments: build -Dgeb.env=chromeHeadless ${{ steps.example_tests.outputs.EXCLUDE_CMD }}
      - name: Run Example Integration Tests
        uses: gradle/gradle-build-action@v3
        env:
          GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
        with:
          arguments: :examples-mongodb-native-session:integrationTest
      - name: Run Build
        uses: gradle/gradle-build-action@v3
        env:
          GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
        with:
          arguments: build -Dgeb.env=chromeHeadless
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [build]
    env:
      WORKSPACE: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '11'
    - name: Publish to repo.grails.org
      id: publish
      uses: gradle/gradle-build-action@v3
      env:
        GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
        ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
        ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
      with:
        arguments: -Dorg.gradle.internal.publish.checksums.insecure=true publish
    - name: Build Docs
      id: docs
      if: steps.build.outcome == 'success'
      uses: gradle/gradle-build-action@v3
      env:
        GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
      with:
        arguments: docs:docs
    - name: Determine docs target repository
      if: steps.docs.outcome == 'success'
      uses: haya14busa/action-cond@v1
      id: docs_target
      with:
        cond: ${{ github.repository == 'grails/gorm-mongodb' }}
        if_true: "grails/grails-data-mapping"
        if_false: ${{ github.repository }}
    - name: Publish to Github Pages
      if: steps.docs.outcome == 'success'
      uses: micronaut-projects/github-pages-deploy-action@master
      env:
        TARGET_REPOSITORY: ${{ steps.docs_target.outputs.value }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        BRANCH: gh-pages
        FOLDER: docs/build/docs
        DOC_SUB_FOLDER: mongodb
        DOC_FOLDER: gh-pages
        COMMIT_EMAIL: behlp@objectcomputing.com
        COMMIT_NAME: Puneet Behl
