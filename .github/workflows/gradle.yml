name: Java CI
on:
  push:
    branches:
      - master
      - '[7-9]+.[1-9]+.x'
  pull_request:
    branches:
      - master
      - '[7-9]+.[1-9]+.x'
  workflow_dispatch:
    inputs:
      message:
        description: 'Snapshot information (e.g. New Core Snapshot Tue Dec 15 00:07:18 UTC 2020 f212f54)'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        java: ['8', '11', '14']
        mongodb-version: ['4.0']
    env:
      WORKSPACE: ${{ github.workspace }}
      GRADLE_OPTS: -Xmx1500m -Dfile.encoding=UTF-8
    steps:
      - name: Print Dispatch Information
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_INFORMATION: ${{ github.event.inputs.message }}
        run: echo $DISPATCH_INFORMATION
      - uses: actions/checkout@v2
      - uses: actions/cache@v2
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: ${{ matrix.java }}
      - name: Optional setup step
        run: |
          [ -f ./setup.sh ] && ./setup.sh || true
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.6.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
      - name: Compile and Run Tests
        run: |
          ./gradlew compileGroovy --no-daemon
          ./gradlew compileTestGroovy --no-daemon
          ./gradlew -Dgeb.env=chromeHeadless check --no-daemon
      - name: Publish Test Report
        if: failure()
        uses: scacap/action-surefire-report@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          report_paths: '**/build/test-results/test/TEST-*.xml'
      - name: Configure AWS credentials
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && matrix.java == '8'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Publish snapshot to CodeArtifact
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && matrix.java == '8'
        env:
          CODEARTIFACT_DOMAIN: ${{ secrets.CODEARTIFACT_DOMAIN }}
          CODEARTIFACT_REPO: ${{ secrets.CODEARTIFACT_REPO }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain $CODEARTIFACT_DOMAIN --domain-owner $AWS_ACCOUNT_ID --query authorizationToken --output text)
          if [ -z "$CODEARTIFACT_AUTH_TOKEN" ]; then
            echo "Failed to retrieve CodeArtifact token"
            exit 1
          fi
          ./gradlew publish \
            -PcodeartifactToken=$CODEARTIFACT_AUTH_TOKEN \
            -PcodeartifactDomain=$CODEARTIFACT_DOMAIN \
            -PcodeartifactRepo=$CODEARTIFACT_REPO \
            -PawsAccountId=$AWS_ACCOUNT_ID \
            -PawsRegion=$AWS_REGION
          echo "Publishing Documentation..."
          ./gradlew docs:docs
