name: Java CI
on:
  push:
    branches:
      - '[6-9]+.[0-9]+.x'
      - feat/native-mongodb-transactions
  pull_request:
  workflow_dispatch:
    inputs:
      message:
        description: 'Snapshot information (e.g. New Core Snapshot Tue Dec 15 00:07:18 UTC 2020 f212f54)'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      WORKSPACE: ${{ github.workspace }}
      GRADLE_OPTS: -Xmx1500m -Dfile.encoding=UTF-8
    strategy:
      matrix:
        mongodb-version: ['4.4', '5.0', '6.0' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build]
    permissions:
      id-token: write
      contents: read
    env:
      WORKSPACE: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '11'
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-2
    - name: Publish snapshot to CodeArtifact
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      run: |
        export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
          --domain coherehealth-main \
          --domain-owner $AWS_ACCOUNT_ID \
          --region us-east-2 \
          --query authorizationToken \
          --output text)
        ./gradlew publish \
          -PcodeartifactToken=$CODEARTIFACT_AUTH_TOKEN \
          -PawsAccountId=$AWS_ACCOUNT_ID
