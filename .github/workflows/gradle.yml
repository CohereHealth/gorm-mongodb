name: Java CI
on:
  push:
    branches:
      - '[6-9]+.[0-9]+.x'
      - feat/native-mongodb-transactions
  pull_request:
    branches:
      - '[6-9]+.[0-9]+.x'
      - feat/native-mongodb-transactions
  workflow_dispatch:
    inputs:
      message:
        description: 'Snapshot information (e.g. New Core Snapshot Tue Dec 15 00:07:18 UTC 2020 f212f54)'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    continue-on-error: true
    env:
      WORKSPACE: ${{ github.workspace }}
      GRADLE_OPTS: -Xmx1500m -Dfile.encoding=UTF-8
    strategy:
      matrix:
        mongodb-version: ['4.4', '5.0', '6.0' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build]
    env:
      WORKSPACE: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '8'
    - name: Configure AWS credentials
      if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_REGION }}
    - name: Publish snapshot to CodeArtifact
      if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      env:
        CODEARTIFACT_DOMAIN: ${{ secrets.CODEARTIFACT_DOMAIN }}
        CODEARTIFACT_REPO: ${{ secrets.CODEARTIFACT_REPO }}
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain $CODEARTIFACT_DOMAIN --domain-owner $AWS_ACCOUNT_ID --query authorizationToken --output text)
        if [ -z "$CODEARTIFACT_AUTH_TOKEN" ]; then
          echo "Failed to retrieve CodeArtifact token"
          exit 1
        fi
        ./gradlew publish \
          -PcodeartifactToken=$CODEARTIFACT_AUTH_TOKEN \
          -PcodeartifactDomain=$CODEARTIFACT_DOMAIN \
          -PcodeartifactRepo=$CODEARTIFACT_REPO \
          -PawsAccountId=$AWS_ACCOUNT_ID \
          -PawsRegion=$AWS_REGION
